[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    # 1. Mask IPv4
    {"regex_pattern": "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b", "mask_with": "ID_IP"},
    
    # 2. Mask Nginx Timestamps [28/Jul/2026:11:22:33 +0000]
    {"regex_pattern": "\\[\\d{2}/\\w{3}/\\d{4}:\\d{2}:\\d{2}:\\d{2} [+-]\\d{4}\\]", "mask_with": "ID_TIME"},

    # 3. Mask versioning (1.1, v1)
    {"regex_pattern": "(v|\\d+)\\.\\d+", "mask_with": "ID_VER"},

    # 4. Advanced Byte Masking (Look-behind is exactly 5 chars: 'space-3digit-space')
    # This captures the bytes sent AFTER the status code, even if Referer follows it.
    {"regex_pattern": "(?<=\\s\\d{3}\\s)\\d+", "mask_with": "ID_BYTES"},

    # 5. Mask numbers in URL paths (User IDs, Order IDs)
    {"regex_pattern": "(?<=/)\\d+\\b", "mask_with": "ID_NUM"},

    # 6. Mask long Hex/UUID strings (Session tokens, API keys)
    {"regex_pattern": "\\b[a-fA-F0-9-]{8,}\\b", "mask_with": "ID_HEX"}
    ]

[DRAIN]
sim_th = 1
depth = 12
max_children = 1000
max_clusters = 5000

extra_delimiters = [' ', '"', '[', ']', '(', ')', '/', '?', '=', '&']
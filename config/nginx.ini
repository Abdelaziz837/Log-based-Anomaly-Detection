[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    # 1. Mask IPv4
    {"regex_pattern": "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b", "mask_with": "ID_IP"},
    
    # 2. Mask Nginx Timestamps
    {"regex_pattern": "\\[\\d{2}/\\w{3}/\\d{4}:\\d{2}:\\d{2}:\\d{2} [+-]\\d{4}\\]", "mask_with": "ID_TIME"},

    # 3. Mask versioning (1.1, v1)
    {"regex_pattern": "(v|\\d+)\\.\\d+", "mask_with": "ID_VER"},

    # 4. Advanced Byte Masking (DO THIS FIRST)
    # It looks for digits following "space-3digits-space"
    {"regex_pattern": "(?<=\\s\\d{3}\\s)\\d+", "mask_with": "ID_BYTES"},

    # 5. Mask HTTP Status Code (DO THIS SECOND)
    # Look for a 3-digit number (100-599) that is surrounded by spaces 
    # and follows the request quote.
    {"regex_pattern": "(?<=\\s)[1-5]\\d{2}(?=\\s)", "mask_with": "ID_STATUS"},

    # 6. Mask numbers in URL paths (User IDs, Order IDs)
    {"regex_pattern": "(?<=/)\\d+\\b", "mask_with": "ID_NUM"},

    # 7. Mask long Hex/UUID strings
    {"regex_pattern": "\\b[a-fA-F0-9-]{8,}\\b", "mask_with": "ID_HEX"}
    ]

[DRAIN]
sim_th = 1
depth = 12
max_children = 1000
max_clusters = 5000

extra_delimiters = [' ', '"', '[', ']', '(', ')', '/', '?', '=', '&']
[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    # 1. FIXED: Capture the Unix Timestamp AND the Date together as one block
    # This prevents the shredding into 4 <ID_VAL> tags.
    {"regex_pattern": "\\d{10,}\\s+\\d{4}\\.\\d{2}\\.\\d{2}", "mask_with": "ID_TIME"},

    # 2. Mask Node/Core locations (R02-M1-N0-C:J12-U11)
    {"regex_pattern": "R\\d{2}-M\\d-N[\\w-]+:J\\d{2}-U\\d{2}", "mask_with": "ID_NODE"},

    # 3. Mask Memory Addresses
    {"regex_pattern": "\\b0x[a-fA-F0-9]+\\b", "mask_with": "ID_HEX"},

    # 4. Mask numbers attached to letters (45C, 3500RPM)
    {"regex_pattern": "(?<=[a-zA-Z])\\d+|\\d+(?=[a-zA-Z])", "mask_with": "ID_VAL"},

    # 5. Mask standalone numbers (only if not already caught by ID_TIME)
    {"regex_pattern": "\\b\\d+\\b", "mask_with": "ID_VAL"}
    ]

[DRAIN]
sim_th = 1
depth = 12
max_children = 1000
max_clusters = 5000
extra_delimiters = [' ', ':', ',', '=', '[', ']', '(', ')', '.', '-']